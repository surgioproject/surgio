name: Node CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
        node-version: [22, 26]

    steps:
      - uses: actions/checkout@v3

      - name: Set up pnpm and Node.js ${{ matrix.node-version }}
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: test, report coverage
        run: |
          pnpm build
          pnpm test:types
          pnpm test:lint
          pnpm test:cli
          pnpm coverage
          pnpm docs:build

      - uses: codecov/codecov-action@v1
        if: success() && matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
