name: Node CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
        node-version: [22, 26]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js ${{ matrix.node-version }}
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: |
          pnpm build
          pnpm test:types
          pnpm lint
          pnpm test:examples
          pnpm test:cli
          pnpm test:package-output
          pnpm coverage
          pnpm test:e2e
          pnpm docs:typecheck
          pnpm docs:build

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: success() && matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/surgio/coverage/lcov.info,packages/gateway/coverage/lcov.info,packages/gateway-frontend/coverage/lcov.info,packages/logger/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
